version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            # Pin pnpm 10: pnpm 11 ignores the `pnpm.overrides` field in
            # package.json, which desyncs it from the lockfile.
            - corepack prepare pnpm@10.13.1 --activate
            # Install from the workspace root so workspace:* deps resolve.
            - cd ../.. && pnpm install --frozen-lockfile && cd apps/web
        build:
          commands:
            - pnpm run build
      artifacts:
        baseDirectory: out
        files:
          - '**/*'
      cache:
        paths:
          - ../../node_modules/**/*
          - node_modules/**/*
          - .next/cache/**/*
