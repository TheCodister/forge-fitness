name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  static:
    name: Lint and typecheck
    runs-on: ubuntu-latest

    env:
      # The backend Prisma config resolves this eagerly during generation.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck backend
        run: pnpm build:backend

      - name: Lint
        # No --max-warnings yet: the repo carries 8 pre-existing warnings.
        # Clear those first, then gate on it.
        run: pnpm lint

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    env:
      # backend/prisma.config.ts resolves env("DATABASE_URL") eagerly, so generation
      # fails without it. Nothing here connects: the unit tests mock the client.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Run vitest
        run: pnpm test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    # Both are fast and run in parallel; no point spending two minutes on a
    # build that already fails to typecheck.
    needs: [static, unit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forge_test
      FRONTEND_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_API_URL: http://127.0.0.1:4000
      JWT_SECRET: ci-fastify-jwt-secret-at-least-32-characters
      # ai-crypto requires exactly 32 bytes of hex. Quoted: YAML would otherwise
      # read an unquoted run of digits as the number 0.
      ENCRYPTION_SECRET: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_USER_EMAIL: benqa@gmail.com
      E2E_USER_PASSWORD: 123456789ben

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Push schema to the test database
        # Prisma 7 dropped --skip-generate from `db push`.
        run: pnpm db:push

      - name: Seed exercise catalog
        run: pnpm db:seed

      - name: Seed e2e test user
        run: pnpm db:seed:test-user

      - name: Build application
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
