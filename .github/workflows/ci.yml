name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10"

jobs:
  static:
    name: Lint + typecheck (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ["@forge/shared", "@forge/api", "@forge/web"]

    env:
      # prisma.config.ts in apps/api resolves env("DATABASE_URL") eagerly.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/unused
      JWT_SECRET: ci-jwt-secret-please-be-at-least-32-chars-long
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api only)
        if: matrix.pkg == '@forge/api'
        run: pnpm --filter @forge/api exec prisma generate

      - name: Typecheck
        run: pnpm --filter ${{ matrix.pkg }} run typecheck

      - name: Lint
        run: pnpm --filter ${{ matrix.pkg }} run lint

  unit:
    name: Unit tests (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: ["@forge/shared", "@forge/api", "@forge/web"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forge_test
      JWT_SECRET: ci-jwt-secret-please-be-at-least-32-chars-long
      ENCRYPTION_SECRET: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client (api only)
        if: matrix.pkg == '@forge/api'
        run: pnpm --filter @forge/api exec prisma generate

      - name: Push schema (api only)
        if: matrix.pkg == '@forge/api'
        run: pnpm --filter @forge/api exec prisma db push

      - name: Run tests
        run: pnpm --filter ${{ matrix.pkg }} run test

  e2e:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    needs: [static, unit]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/forge_test
      JWT_SECRET: ci-jwt-secret-please-be-at-least-32-chars-long
      ENCRYPTION_SECRET: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
      COOKIE_SECURE: "false"
      CORS_ORIGINS: "http://127.0.0.1:3000"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_USER_EMAIL: benqa@gmail.com
      E2E_USER_PASSWORD: 123456789ben

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @forge/api exec prisma generate

      - name: Push schema to the test database
        run: pnpm --filter @forge/api exec prisma db push

      - name: Seed exercise catalog
        run: pnpm --filter @forge/api run db:seed

      - name: Seed e2e test user
        run: pnpm --filter @forge/api run db:seed:test-user

      - name: Build web
        run: pnpm --filter @forge/web run build

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @forge/web exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm --filter @forge/web run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
